name: Build and publish APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Configure Android signing secrets in repository Settings > Secrets and variables > Actions.'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Notification-Always-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Notification Always ${{ github.ref_name }}
          body: |
            # Notification Always

            ## Tính năng
            - Kiểm tra và khôi phục kết nối Google Play Services theo lịch để hỗ trợ hạn chế thông báo đến trễ.
            - Tự lên lịch lại sau khi khởi động lại hoặc cập nhật ứng dụng.
            - Điều chỉnh lịch theo trạng thái pin, sạc, tiết kiệm pin và mạng.
            - Cung cấp lối tắt tới cài đặt pin, tự khởi chạy và Google Play Services.

            ## Cách sử dụng
            1. Cài APK và mở ứng dụng.
            2. Bật **Bật kiểm tra kết nối**.
            3. Đặt ứng dụng và Google Play Services ở chế độ pin **Không hạn chế**; bật quyền tự khởi chạy trong cài đặt ROM.
            4. Cho phép tự khởi chạy cho ứng dụng chat/ngân hàng cần nhận thông báo.

            Cần có Google Play Services. Hiệu quả còn tùy ROM và cài đặt nền của từng máy.
          files: ${{ runner.temp }}/Notification-Always-${{ github.ref_name }}.apk
