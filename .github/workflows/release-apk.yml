name: Build and publish APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Configure Android signing secrets in repository Settings > Secrets and variables > Actions.'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/release/app-release.apk | grep -q 'android.permission.INTERNET'; then
            echo 'Release APK unexpectedly requests Internet access.'
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Notification-Always-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Notification Always ${{ github.ref_name }}
          body: |
            # Notification Always

            ## Tính năng
            - Kiểm tra Google Play Services và Play Store có cài/bật, cùng hạn chế nền của app.
            - Hướng dẫn mở cài đặt pin, tự khởi chạy và Google Play Services.
            - Cho phép thử gửi tín hiệu định kỳ tới Google Play Services khi người dùng bật. Lịch 15–30 phút như trước, tăng lên 60 phút khi pin dưới 20% và không sạc.
            - Có tùy chọn cho phép app bỏ qua tối ưu pin khi thử nghiệm định kỳ.
            - Hiển thị thời điểm alarm chạy và thời điểm thử gửi tín hiệu riêng biệt.

            ## Cách sử dụng
            1. Cài APK và mở ứng dụng.
            2. Xem phần **Chẩn đoán trên máy** và xử lý các lỗi được báo.
            3. Cho phép Google Play Services và các ứng dụng cần nhận tin chạy nền, tự khởi chạy và hiển thị thông báo.
            4. Có thể bật **thử nghiệm định kỳ** để so sánh độ trễ trên cùng điện thoại.

            Trạng thái cài/bật không xác nhận FCM hoạt động. Việc gửi tín hiệu cũng không xác nhận kết nối FCM đã phục hồi. Hiệu quả còn tùy ROM, Google Play Services và ứng dụng nhận tin.
          files: ${{ runner.temp }}/Notification-Always-${{ github.ref_name }}.apk
